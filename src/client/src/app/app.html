<mat-toolbar class="bar">
  <h1 class="title">GalaxyData</h1>
  <span class="spacer"></span>
  <button
    matIconButton
    [matMenuTriggerFor]="schemeMenu"
    aria-label="Color scheme"
    matTooltip="Color scheme: {{ scheme().label }}"
  >
    <mat-icon>{{ scheme().icon }}</mat-icon>
  </button>
  <mat-menu #schemeMenu="matMenu">
    @for (option of schemes; track option.choice) {
      <button
        mat-menu-item
        role="menuitemradio"
        [attr.aria-checked]="option.choice === colorScheme.choice()"
        (click)="colorScheme.choose(option.choice)"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label }}</span>
      </button>
    }
  </mat-menu>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
